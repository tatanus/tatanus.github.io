name: Regenerate feed and sitemap

# Only runs when the post index actually changes. The job's own commit touches
# feed.xml and sitemap.xml, never blog/posts.json, so it cannot retrigger itself.
on:
  push:
    branches: [main]
    paths: ['blog/posts.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate
        run: python3 tools/generate_feed.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain feed.xml sitemap.xml)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed.xml sitemap.xml
            git commit -m "Regenerate feed and sitemap from posts.json"
            git push
          else
            echo "feed.xml and sitemap.xml already up to date"
          fi
