<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HillbillyStorytime - Sponsor Me</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <script>
    /* Applies the saved theme before first paint. Inline on purpose: script.js
       is deferred, so it runs after the page has already painted light. */
    (function () {
      var dark = localStorage.getItem("darkmode") === "true";
      if (dark) document.body.classList.add("dark");
      var light = document.getElementById("prism-theme-light"),
          night = document.getElementById("prism-theme-dark");
      if (light && night) { light.disabled = dark; night.disabled = !dark; }
    })();
  </script>
  <!-- Navbar -->
  <div id="navbar"></div>

  <div class="container">
    <h1>Sponsor My Work</h1>
    <p>Support HillbillyStorytime through one-time tips or ongoing sponsorships:</p>

    <!-- One-Time Support -->
    <h2>☕ One-Time Support</h2>
    <div class="sponsor-buttons">
      <a class="sponsor-btn bmc" href="https://www.buymeacoffee.com/tatanus" target="_blank">Buy Me a Bourbon</a>
      <a class="sponsor-btn ko-fi" href="https://ko-fi.com/M4M01UQWR" target="_blank">Ko-Fi</a>
      <a class="sponsor-btn paypal" href="https://www.paypal.com/donate/?business=LTWND59CZYJNG&no_recurring=0&currency_code=USD" target="_blank">PayPal</a>
    </div>

    <!-- Ongoing Support -->
    <h2>🔄 Ongoing Sponsorship</h2>
    <div class="sponsor-buttons">
      <a class="sponsor-btn github" href="https://github.com/sponsors/tatanus" target="_blank">GitHub Sponsors</a>
      <a class="sponsor-btn liberapay" href="https://liberapay.com/adam.compton" target="_blank">Liberapay</a>
    </div>

    <p class="thanks">Every bit of support means the world — thank you! 🍻</p>
  </div>

  <div id="footer"></div>
</body>
</html>
